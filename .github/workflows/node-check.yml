# Shared check gate for Node products (P0 — azzara-spirit spec 2026-10-09 §5.11).
#
# REUSABLE (workflow_call). A product's ci-cd.yml adds:
#
#   check:
#     uses: azzarabe/azzara-infra/.github/workflows/node-check.yml@main
#     with:
#       private-repos: azzara-auth,azzara-ai,azzara-ui   # the private @azzara/* repos it installs
#       postgres: true                                   # optional: PostgreSQL 16 + DATABASE_URL for the tests
#       postgres-after-install: true                     # optional, with postgres: true: start PostgreSQL only after npm ci (see below)
#       runs_on: '["self-hosted","azzara-ci"]'           # optional: the job's runs-on as JSON; omit it and the job runs on ubuntu-latest
#       node-modules-cache: true                         # optional: reuse node_modules by lockfile hash (see below)
#       changed-only: true                               # optional: on a pull request, run only the tests the change touches (see below)
#       timeout-minutes: 30                              # optional: the job's timeout in minutes; default 15 (see below)
#       playwright: true                                 # optional: install Playwright's Chromium headless shell for the tests (see below)
#       test-command: npm run test:nightly               # optional: run this command instead of the test step (see below)
#     secrets:                                          # only these two — never `secrets: inherit`
#       AZZARA_APP_ID: ${{ secrets.AZZARA_APP_ID }}
#       AZZARA_APP_PRIVATE_KEY: ${{ secrets.AZZARA_APP_PRIVATE_KEY }}
#
# `postgres: true` starts a PostgreSQL 16 service and gives the tests DATABASE_URL=postgres://check:check@127.0.0.1:5432/check.
# node-check also sets NODE_CHECK_POSTGRES=true|false (from that input, separately from DATABASE_URL), so a test can fail
# when a database was asked for and none reached it.
#
# `postgres-after-install: true` (off by default; only with `postgres: true`): the `services:` container of a job always starts before its
# first step, so it is up while `npm ci` runs; on a runner whose memory cap `npm ci` barely fits (the immo row of the CI box, 2.5 GiB) the two
# together can get npm OOM-killed. With this input the service starts nothing (its image is empty, as when `postgres` is false) and, right after
# `npm ci` and "Save node_modules", a step runs `docker run -d` of postgres:16 (name node-check-pg-<run id>-<attempt>, the same user, password and
# database as the service, published on 127.0.0.1:5432 as the service is), then waits up to 60 s for `pg_isready` over TCP and a `select 1`, and fails
# the job when the database does not answer; a last step with `if: always()` runs `docker rm -f` on it. It needs the `docker` CLI and a reachable
# daemon in the job's steps (a runner row of kind docker has both; the same need as the `services:` path). DATABASE_URL and NODE_CHECK_POSTGRES are
# the same as with the service. Off (the default), or with `postgres` false, nothing changes: the `services:` path is the one that runs.
#
# The product owns its scripts; this workflow owns the order and the gates:
#   npm ci → npm audit --omit=dev --audit-level=high (security.md) → npm run lint --if-present
#   → npm run typecheck → npm run test:coverage (the threshold lives in the product's script).
#
# The audit step has two paths. With no `.nsprc` in working-directory it is `npm audit --omit=dev --audit-level=high`, as security.md says.
# With a `.nsprc` it runs the pinned better-npm-audit 4.2.1 (`-l high -p --require-expiry --require-notes --max-expiry-days 30`) and a checker,
# .github/audit-gate/check-exceptions-unpatched.mjs. `.nsprc` keys are GHSA ids only, each with `notes` and an `expiry` at most 30 days ahead;
# the checker fails when a named advisory has a patched version for any package, is withdrawn, or when the GitHub advisory API cannot be read
# (fail closed). An exception therefore lapses by expiry, and as soon as a fix is published. Tests: .github/audit-gate/test/ (audit-gate.yml).
# The tool's package.json and lockfile and the checker are embedded in the step as copies of the files in .github/audit-gate/.
#
# `node-modules-cache: true` restores node_modules from the Actions cache when one was saved for the exact key (runner OS
# and architecture, the Node version setup-node installed, the SHA-256 of package-lock.json) and then skips `npm ci`; on a
# miss `npm ci` runs as before and its node_modules is saved under that key. No partial key is ever restored. Off by
# default: the cache holds the private @azzara/* packages' installed code, so a caller turns it on only in a private
# repository. The cache is the caller repository's own (a pull request's saves stay in its ref's scope).
#
# `changed-only: true` (off by default; a vitest product only): on a pull_request event the last step is
# `npx vitest run --changed origin/<base branch>` instead of `npm run test:coverage`: vitest runs the test files that import a
# changed file, and the whole suite when package.json, a vitest or vite config changed (vitest's default forceRerunTriggers).
# It runs WITHOUT coverage: a coverage threshold over a subset of the tests would fail, so the threshold is enforced by the
# full `npm run test:coverage` that every other event (push to main, workflow_dispatch, schedule) still runs, as does a pull
# request with the input off. To see the diff the checkout fetches the whole history (fetch-depth 0), and the step stops
# with an error when origin/<base> is not there: vitest itself exits 0 ("No test files found") when the diff cannot be read.
# A pull request that changes no file a test imports runs no test and passes; that is vitest's own result.
#
# `timeout-minutes` (number, default 15): the check job's timeout-minutes. A product whose full `npm run test:coverage` needs more
# than 15 minutes on its runner passes a larger value; omit it and the job keeps the 15 minutes it always had.
#
# `playwright: true` (off by default): after the dependencies are installed, `npx playwright install --only-shell chromium` puts the
# Chromium headless shell of the product's own Playwright version in the runner's cache (~/.cache/ms-playwright), for tests that
# launch a browser inside the unit test run. Without root and without --with-deps: the runner must already have Chromium's system
# libraries (the CI box: hosts/vps-ci/owner/ci-box-chromium-deps.sh). Off, no step runs and nothing changes.
#
# `test-command` (string, default empty): empty = nothing changes, the test step is the one above. Set, BOTH test steps (`vitest run --changed` and
# `npm run test:coverage`) are skipped and one step runs the command in working-directory, with the environment the test steps have: NODE_CHECK_POSTGRES
# (job env) and, with `postgres: true`, DATABASE_URL (written to GITHUB_ENV by "Give the tests the database", which runs before). The audit scan, lint
# and typecheck still run. For a product whose gate runs a slower suite on a schedule (immo: `npm run test:nightly`, with postgres, postgres-after-install
# and playwright). The input reaches the step through env (TEST_COMMAND), never through `${{ }}` inside `run:`, and runs as `bash -c "$TEST_COMMAND"`:
# a child shell parses the string once, as the caller wrote it, and takes no part in this step's own script (eval would run it inside it). The caller
# writes the command, so it is as trusted as the caller's own workflow file.
#
# The product must have the scripts `typecheck` and `test:coverage` (npm fails on a missing script),
# commit a package-lock.json in working-directory, and hold AZZARA_APP_ID and AZZARA_APP_PRIVATE_KEY as
# its own repository secrets (azzarabe is a user account: no org secrets).
name: node-check
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      working-directory:
        type: string
        default: "."
      private-repos:
        description: "Comma-separated azzarabe repos the App token may read; empty = no private packages"
        type: string
        default: ""
      app-owner:
        description: "The account that owns the repos in private-repos (the App token's owner). Stays azzarabe while the libraries live there, even for a caller that has moved to the azzara-hq org; do not derive it from the caller's owner"
        type: string
        default: "azzarabe"
      postgres:
        description: "true = a PostgreSQL 16 service, and DATABASE_URL=postgres://check:check@127.0.0.1:5432/check for the tests"
        type: boolean
        default: false
      postgres-after-install:
        description: "true (with postgres: true) = no services: container; the same PostgreSQL 16 is started with docker run after npm ci (lower peak memory during npm ci), and removed at the end of the job; false = the services: container, as before"
        type: boolean
        default: false
      node-modules-cache:
        description: "true = restore node_modules from the Actions cache by exact lockfile key and skip npm ci on a hit; false = npm ci every run"
        type: boolean
        default: false
      changed-only:
        description: "true = on a pull_request event run `vitest run --changed origin/<base>` (no coverage) instead of npm run test:coverage; any other event still runs test:coverage"
        type: boolean
        default: false
      timeout-minutes:
        description: "The check job's timeout in minutes"
        type: number
        default: 15
      playwright:
        description: "true = npx playwright install --only-shell chromium (no root, no --with-deps) before lint and the tests; false = no browser"
        type: boolean
        default: false
      test-command:
        description: "empty = the usual test step (vitest --changed or npm run test:coverage); set = skip both and run this command (bash -c) in working-directory, with DATABASE_URL and NODE_CHECK_POSTGRES as the tests have them"
        type: string
        default: ""
      runs_on:
        description: 'JSON for the job''s runs-on: a string ("ubuntu-latest") or an array (["self-hosted","azzara-ci"])'
        type: string
        default: '"ubuntu-latest"'
    secrets:
      AZZARA_APP_ID:
        required: false
      AZZARA_APP_PRIVATE_KEY:
        required: false

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    services:
      postgres:
        # An empty image starts no service: the default path stays as it was (the selftest's `check` job runs it). `postgres-after-install` also empties it: the database is started by the step after npm ci.
        image: ${{ inputs.postgres && !inputs.postgres-after-install && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: check
          POSTGRES_PASSWORD: check
          POSTGRES_DB: check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # From the `postgres` input, by a path separate from the DATABASE_URL step below: a test can then fail when
      # a database was asked for and none reached it (the selftest's check-db job does).
      NODE_CHECK_POSTGRES: ${{ inputs.postgres }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 0 = the whole history, which `vitest --changed origin/<base>` needs; 1 (the checkout default) otherwise. The `!` form: `cond && 0 || 1` would give 1 because 0 is falsy.
          fetch-depth: ${{ !(inputs.changed-only && github.event_name == 'pull_request') && 1 || 0 }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - uses: actions/create-github-app-token@v3
        if: inputs.private-repos != ''
        id: app-token
        with:
          app-id: ${{ secrets.AZZARA_APP_ID }}
          private-key: ${{ secrets.AZZARA_APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read
      - name: Configure git auth for the private @azzara/* packages
        if: inputs.private-repos != ''
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: node_modules cache key
        if: inputs.node-modules-cache
        id: nm-key
        env:
          LOCK_HASH: ${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        run: |
          set -euo pipefail
          if [ -z "${LOCK_HASH}" ]; then echo "::error::no package-lock.json to key node_modules on"; exit 1; fi
          echo "key=node-modules-${RUNNER_OS}-${RUNNER_ARCH}-$(node -p process.version)-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore node_modules (exact key only)
        if: inputs.node-modules-cache
        id: nm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ steps.nm-key.outputs.key }}
      - name: npm ci
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save node_modules
        if: inputs.node-modules-cache && steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ steps.nm-key.outputs.key }}
      - name: Start PostgreSQL 16 (after npm ci)
        if: inputs.postgres && inputs.postgres-after-install
        run: |
          set -euo pipefail
          name="node-check-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$name" -e POSTGRES_USER=check -e POSTGRES_PASSWORD=check -e POSTGRES_DB=check -p 127.0.0.1:5432:5432 postgres:16 >/dev/null
          # -h 127.0.0.1: the image's init server listens on its socket only, so a TCP answer means the real server is up.
          for i in $(seq 1 30); do
            if docker exec "$name" pg_isready -h 127.0.0.1 -U check -d check >/dev/null 2>&1 \
               && docker exec "$name" psql -h 127.0.0.1 -U check -d check -tAc 'select 1' >/dev/null 2>&1; then
              echo "postgres answered on attempt $i of 30"; exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not answer within 60 s"; docker logs --tail 30 "$name" || true; exit 1
      - name: Install Playwright's Chromium headless shell (without root)
        if: inputs.playwright
        run: npx playwright install --only-shell chromium
      - name: Dependency scan (production dependencies, fail on high/critical; per-advisory exceptions only with a .nsprc)
        run: |
          set -euo pipefail
          # No .nsprc in working-directory: the plain scan, exactly as before this step knew exceptions.
          if [ ! -f .nsprc ]; then
            npm audit --omit=dev --audit-level=high
            exit 0
          fi
          # .nsprc present: the audit tool is installed from the lockfile below (a copy of .github/audit-gate/ of azzara-infra; a caller's checkout
          # has no azzara-infra files, and the tests compare these copies byte for byte), then better-npm-audit accepts only the advisories
          # .nsprc names, each with notes and an expiry of at most 30 days ahead, and the checker fails when a named advisory has a patched version.
          tool="${RUNNER_TEMP}/audit-gate-tool"
          rm -rf "${tool:?}"
          mkdir -p "$tool"
          cat > "$tool/package.json" <<'AUDIT_GATE_PACKAGE_JSON_EOF'
          {
            "name": "audit-gate-tool",
            "private": true,
            "description": "The pinned audit tool node-check.yml installs when a product has a .nsprc (npm ci from the lockfile next to this file).",
            "dependencies": {
              "better-npm-audit": "4.2.1"
            }
          }
          AUDIT_GATE_PACKAGE_JSON_EOF
          cat > "$tool/package-lock.json" <<'AUDIT_GATE_PACKAGE_LOCK_EOF'
          {
            "name": "audit-gate-tool",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "audit-gate-tool",
                "dependencies": {
                  "better-npm-audit": "4.2.1"
                }
              },
              "node_modules/ajv": {
                "version": "8.20.0",
                "resolved": "https://registry.npmjs.org/ajv/-/ajv-8.20.0.tgz",
                "integrity": "sha512-Thbli+OlOj+iMPYFBVBfJ3OmCAnaSyNn4M1vz9T6Gka5Jt9ba/HIR56joy65tY6kx/FCF5VXNB819Y7/GUrBGA==",
                "license": "MIT",
                "dependencies": {
                  "fast-deep-equal": "^3.1.3",
                  "fast-uri": "^3.0.1",
                  "json-schema-traverse": "^1.0.0",
                  "require-from-string": "^2.0.2"
                },
                "funding": {
                  "type": "github",
                  "url": "https://github.com/sponsors/epoberezkin"
                }
              },
              "node_modules/ansi-regex": {
                "version": "5.0.1",
                "resolved": "https://registry.npmjs.org/ansi-regex/-/ansi-regex-5.0.1.tgz",
                "integrity": "sha512-quJQXlTSUGL2LH9SUXo8VwsY4soanhgo6LNSm84E1LBcE8s3O0wpdiRzyR9z/ZZJMlMWv37qOOb9pdJlMUEKFQ==",
                "license": "MIT",
                "engines": {
                  "node": ">=8"
                }
              },
              "node_modules/ansi-styles": {
                "version": "4.3.0",
                "resolved": "https://registry.npmjs.org/ansi-styles/-/ansi-styles-4.3.0.tgz",
                "integrity": "sha512-zbB9rCJAT1rbjiVDb2hqKFHNYLxgtk8NURxZ3IZwD3F6NtxbXZQCnnSi1Lkx+IDohdPlFp222wVALIheZJQSEg==",
                "license": "MIT",
                "dependencies": {
                  "color-convert": "^2.0.1"
                },
                "engines": {
                  "node": ">=8"
                },
                "funding": {
