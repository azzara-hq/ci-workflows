          AUDIT_GATE_PACKAGE_LOCK_EOF
          cat > "$tool/check-exceptions-unpatched.mjs" <<'AUDIT_GATE_CHECKER_EOF'
          // Fails when an audit exception in .nsprc may no longer stand: the key is not a GHSA id, or the advisory is withdrawn,
          // or it now has a patched version for any package (GitHub advisory API first_patched_version not null), or the API
          // cannot be read. It fails closed. Expiry, notes and the audit itself are better-npm-audit's job
          // (--require-expiry --require-notes --max-expiry-days, see node-check.yml).
          // Usage: node check-exceptions-unpatched.mjs [path/to/.nsprc]   (GITHUB_TOKEN optional, raises the API rate limit)
          // ADVISORY_API (default https://api.github.com/advisories/) exists for the tests' stub server only.
          // node-check.yml carries a byte-identical copy of this file (a callers' checkout has no azzara-infra files); the tests compare the two.
          import { readFileSync } from "node:fs";

          const file = process.argv[2] ?? ".nsprc";
          let exceptions;
          try {
            exceptions = JSON.parse(readFileSync(file, "utf8"));
          } catch (e) {
            console.error(`::error::${file} cannot be read as JSON: ${e.message}`);
            process.exit(1);
          }
          if (exceptions === null || typeof exceptions !== "object" || Array.isArray(exceptions)) {
            console.error(`::error::${file} is not a JSON object keyed by GHSA id`);
            process.exit(1);
          }
          const api = process.env.ADVISORY_API ?? "https://api.github.com/advisories/";
          const headers = { accept: "application/vnd.github+json", "user-agent": "audit-exception-check" };
          if (process.env.GITHUB_TOKEN) headers.authorization = `Bearer ${process.env.GITHUB_TOKEN}`;

          let failed = false;
          for (const id of Object.keys(exceptions)) {
            if (!/^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$/.test(id)) {
              console.error(`::error::${file}: exception "${id}" is not a GHSA id`);
              failed = true;
              continue;
            }
            const res = await fetch(api + id, { headers }).catch((e) => ({ ok: false, status: e.cause?.code ?? e.message }));
            if (!res.ok) {
              console.error(`::error::${id}: advisory API answered ${res.status}; cannot show the advisory is still unpatched`);
              failed = true;
              continue;
            }
            const adv = await res.json();
            const patched = (adv.vulnerabilities ?? []).filter((v) => v.first_patched_version);
            if (adv.withdrawn_at || patched.length > 0 || (adv.vulnerabilities ?? []).length === 0) {
              const what = patched.map((v) => `${v.package?.name} ${v.first_patched_version}`).join(", ") || "withdrawn or no package";
              console.error(`::error::${id}: a fix exists (${what}); update the dependency and remove the exception`);
              failed = true;
            } else {
              console.log(`${id}: no patched version published (${adv.vulnerabilities.map((v) => `${v.package?.name} ${v.vulnerable_version_range}`).join(", ")})`);
            }
          }
          process.exit(failed ? 1 : 0);
          AUDIT_GATE_CHECKER_EOF
          (cd "$tool" && npm ci --ignore-scripts --no-audit --no-fund)
          rc=0
          # The token (it raises the advisory API's rate limit) goes to the checker alone: not to npm audit, nor to the tool and its dependencies.
          GITHUB_TOKEN="${{ github.token }}" node "$tool/check-exceptions-unpatched.mjs" .nsprc || rc=1
          "$tool/node_modules/.bin/better-npm-audit" audit -l high -p --require-expiry --require-notes --max-expiry-days 30 || rc=1
          exit "$rc"
      - run: npm run lint --if-present
      - run: npm run typecheck
      - name: Give the tests the database
        if: inputs.postgres
        run: echo "DATABASE_URL=postgres://check:check@127.0.0.1:5432/check" >> "$GITHUB_ENV"
      - name: Tests the pull request changes (vitest --changed, no coverage)
        if: inputs.test-command == '' && inputs.changed-only && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::origin/${BASE_REF} is not in the checkout, so vitest cannot read the diff (it would exit 0 having run nothing)"; exit 1
          fi
          npx vitest run --changed "origin/${BASE_REF}"
      - run: npm run test:coverage
        if: ${{ inputs.test-command == '' && !(inputs.changed-only && github.event_name == 'pull_request') }}
      - name: Tests (the caller's test-command)
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_COMMAND"
      - name: Remove the PostgreSQL container
        if: always() && inputs.postgres && inputs.postgres-after-install
        run: docker rm -f -v "node-check-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || echo "::warning::could not remove the PostgreSQL container (the runner row's hooks wipe it)"
