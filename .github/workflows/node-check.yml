                }
              },
              "node_modules/astral-regex": {
                "version": "2.0.0",
                "resolved": "https://registry.npmjs.org/astral-regex/-/astral-regex-2.0.0.tgz",
                "integrity": "sha512-Z7tMw1ytTXt5jqMcOP+OQteU1VuNK9Y02uuJtKQ1Sv69jXQKKg5cibLwGJow8yzZP+eAc18EmLGPal0bp36rvQ==",
                "license": "MIT",
                "engines": {
